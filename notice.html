ure><div id="posts-here"></div><script>(async () => {
  // 1) <head>의 JSON feed 링크를 우선 사용 (서브폴더 배포에서도 안전)
  const jsonLink = document.querySelector('link[rel="alternate"][type="application/json"]');
  const FEED_URL = jsonLink ? jsonLink.href : 'feed.json';

  // 2) 설정
  const LIMIT = 10;            // 가져올 게시글 개수
  const TAG_FILTER = null;     // 예: 'notice' 로 지정하면 해당 태그만 표시. 전체면 null

  // 3) 유틸: 본문 요약 만들기
  const strip = (html) => (new DOMParser().parseFromString(html, 'text/html').body.textContent || '');
  const cut = (t, n=160) => t.length > n ? t.slice(0, n).trim() + '…' : t;

  try {
    const res = await fetch(FEED_URL, {cache:'no-store'});
    const feed = await res.json(); // JSON Feed v1: feed.items[]
    let items = feed.items || [];

    // 태그 필터 (Publii는 item.tags 배열이 존재)
    if (TAG_FILTER) {
      items = items.filter(it => (it.tags || []).map(String).includes(String(TAG_FILTER)));
    }

    const list = items.slice(0, LIMIT).map(it => {
      const url = it.url || it.external_url || '#';
      const title = it.title || '(untitled)';
      const date = it.date_published ? new Date(it.date_published) : null;
      const dateStr = date ? date.toISOString().slice(0,10) : '';
      const excerpt = cut(strip(it.summary || it.content_text || it.content_html || ''), 180);

      return `
        <div class="post-item">
          <a href="${url}">${title}</a>
          ${dateStr ? `<div class="meta">${dateStr}</div>` : ``}
          ${excerpt ? `<div class="excerpt">${excerpt}</div>` : ``}
        </div>
      `;
    }).join('');

    document.getElementById('posts-here').innerHTML =
      `<div class="page-posts">${list || '<p>게시글이 없습니다.</p>'}</div>`;
  } catch (e) {
    document.getElementById('posts-here').innerHTML =
      '<p>포스트를 불러오지 못했습니다.</p>';
    console.error(e);
  }
})();</script></div></article></main><footer class="footer"><div class="wrapper"><div class="footer__copyright"><p>Powered by Publii</p></div><button id="backToTop" class="footer__bttop" aria-label="Back to top" title="Back to top"><svg width="20" height="20"><use xlink:href="https://ineclove.github.io/assets/svg/svg-map.svg#toparrow"/></svg></button></div></footer><script defer="defer" src="https://ineclove.github.io/assets/js/scripts.min.js?v=ffcbea6c02c8178d10092962b235a5b0"></script><script>window.publiiThemeMenuConfig={mobileMenuMode:'sidebar',animationSpeed:300,submenuWidth: 'auto',doubleClickTime:500,mobileMenuExpandableSubmenus:true,relatedContainerForOverlayMenuSelector:'.top'};</script><script>var images = document.querySelectorAll('img[loading]');
